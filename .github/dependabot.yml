version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-dev-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  # Fuzz harness has its own lockfile (workspace-excluded).
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
