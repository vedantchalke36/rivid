services:
  postgres:
    image: postgres:16.4-alpine   # pinned per BENCHMARK_METHODOLOGY.md §7
    container_name: rivid-bench-pg
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_USER: postgres
      POSTGRES_DB: ids
    ports:
      - "54329:5432"
    # Deterministic config shared by every language's ORM benchmark.
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=100
      -c synchronous_commit=on
      -c fsync=on
      -c wal_level=replica
      -c checkpoint_timeout=15min
      -c max_wal_size=4GB
      -c work_mem=16MB
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ids"]
      interval: 2s
      timeout: 2s
      retries: 20
