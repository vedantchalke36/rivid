[package]
name = "rivid-wasm"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly bindings for the rivid ID engine — ULID/UUIDv7 in the browser"
repository = "https://github.com/vedantchalke36/rivid"
publish = false

# Standalone: excluded from the root NAPI workspace so host-target lint/test
# jobs never compile the wasm stack (mirrors integrations/sqlx).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rivid-core = { path = "../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# Browser entropy: this feature feeds rand's ChaCha12 OS-seeding through
# crypto.getRandomValues via getrandom's unified feature resolution.
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
