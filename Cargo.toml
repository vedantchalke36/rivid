[package]
name = "rivid-core-napi"
version = "1.0.0"
edition = "2021"
# napi-build emits `cargo::` build-script directives, which require 1.77+.
rust-version = "1.77"
license = "MIT"
description = "NAPI-RS bindings for the rivid Rust ID engine"
repository = "https://github.com/vedantchalke36/rivid"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi6"] }
napi-derive = "3.6"
rivid-core = { path = "./crates/core" }

[build-dependencies]
napi-build = "2"

[workspace]
members = ["crates/core"]
exclude = ["fuzz"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
