[project]
name = "rivid-integration-sqlalchemy"
version = "0.1.0"
private = true
description = "SQLAlchemy 2.0 integration tests for ULID primary keys on PostgreSQL"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "rivid",
]

[tool.uv.sources]
rivid = { path = "../../packages/python" }

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
